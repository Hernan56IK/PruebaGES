[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "nodejs_22"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "rm -rf node_modules package-lock.json",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
